<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e7e9ee;
      --muted: #8a90a0;
      --accent: #4f8dfd;
      --danger: #e5566d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 28px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field {
      margin-bottom: 18px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #0f1218;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
    }

    .errors {
      background: rgba(229, 86, 109, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.88;
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .footer-link a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue</p>

    {% if error %}
    <div class="errors">
      {{error}}
    </div>
    {% endif %}

    <form method="POST" autocomplete="off">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" name="username" value = "" autofocus autocomplete = "off">
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input type="password" name="password" value ="" autocomplete = "off">
      </div>
      <button type="submit">Log In</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>

    <div class="footer-link">
      Don't have an account? <a href="{% url 'register' %}">Sign up</a>
    </div>
  </div>
</body>
</html>
